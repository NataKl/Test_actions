# Пример конфигурации Nginx для проксирования запросов к приложению
# Поместите этот файл в /etc/nginx/sites-available/time-server
# и создайте симлинк: sudo ln -s /etc/nginx/sites-available/time-server /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;  # Замените на ваш домен
    
    # Максимальный размер тела запроса
    client_max_body_size 10M;
    
    # Логи
    access_log /var/log/nginx/time-server-access.log;
    error_log /var/log/nginx/time-server-error.log;
    
    # Проксирование на приложение
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (если понадобится в будущем)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoint (можно использовать для мониторинга)
    location /health {
        proxy_pass http://localhost:8000/health;
        access_log off;
    }
}

