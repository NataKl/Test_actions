name: Build and Deploy (Docker Compose)

# Альтернативный workflow с использованием docker-compose
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # ДЖОБА 1: Сборка и публикация Docker образа
  # ============================================
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix={{branch}}-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================
  # ДЖОБА 2: Деплой на удаленный сервер через SSH
  # с использованием Docker Compose
  # ============================================
  deploy:
    name: Deploy to Server (Docker Compose)
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      # Копируем docker-compose.yml на сервер и запускаем
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.yml"
          target: "~/time-server"
      
      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Переходим в рабочую директорию
            cd ~/time-server
            
            # Логинимся в GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Устанавливаем переменную окружения для репозитория
            export GITHUB_REPOSITORY=${{ github.repository }}
            
            # Останавливаем старые контейнеры
            docker-compose down || true
            
            # Скачиваем новый образ
            docker-compose pull
            
            # Запускаем новые контейнеры
            docker-compose up -d
            
            # Проверяем статус
            docker-compose ps
            
            # Очищаем неиспользуемые образы
            docker image prune -f
      
      - name: Check application health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Ждем запуска приложения
            sleep 15
            
            # Проверяем health endpoint
            curl -f http://localhost:8000/health || exit 1
            
            # Проверяем логи (последние 20 строк)
            cd ~/time-server
            docker-compose logs --tail=20
            
            echo "✅ Deployment successful! Application is healthy."
